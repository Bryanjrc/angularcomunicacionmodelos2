<h1>Padre Números</h1>

<h1 style="background-color: yellow;">
    La suma es {{suma}}
</h1>

<button (click)="generarNumero()">
    Generar número
</button>

@for (num of arrayNumeros; track num) {
    <app-hijo-numero-component
    [numero] = "num"
    (sumarNumerosParent)="sumarNumerosParent($event)">
    </app-hijo-numero-component>
}
